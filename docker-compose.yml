version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: localexplore_backend
    ports:
      - "5249:5249"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal;Database=LocalExploreDb;Trusted_Connection=True;TrustServerCertificate=True;
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./local-explore-frontend
      dockerfile: Dockerfile
    container_name: localexplore_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
